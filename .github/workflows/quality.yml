name: Validate public Atlas package

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out compiled publication
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate routes, data, replays, and publication boundary
        run: node scripts/validate-publication.mjs
